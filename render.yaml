services:
  - type: web
    name: nourish-api
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: "off"
    rootDir: backend
    buildCommand: pip install -r requirements.lock.txt
    startCommand: bash start-render.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        value: ""
      - key: APP_TIMEZONE
        value: Asia/Kolkata
