services:
  - type: web
    name: nourish
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: "off"
    rootDir: backend
    buildCommand: pip install -r requirements.lock.txt
    startCommand: bash start-render.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nourish-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://nourish-dto7.vercel.app
      - key: CORS_ORIGINS
        value: https://nourish-dto7.vercel.app
      - key: APP_TIMEZONE
        value: Asia/Kolkata

databases:
  - name: nourish-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
