services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nourish
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nourish_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nourish"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nourish_pg:
